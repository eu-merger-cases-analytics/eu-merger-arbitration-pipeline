services:
  db:
    image: pgduckdb/pgduckdb:18-v1.1.1
    container_name: eu-merger-arbitration-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - ./data:/data
      - ./scripts:/scripts
      - ./init:/init
      - eu-merger-arbitration:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: eu-merger-arbitration-python
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./scripts:/scripts
      - ./config:/config
      - ./logs:/logs
    working_dir: /scripts
    tty: true

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: eu-merger-arbitration-dbt
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./dbt:/dbt
      - ./data:/data
    working_dir: /dbt
    tty: true

  superset:
    image: apache/superset:4.1.2-dev
    container_name: eu-merger-arbitration-superset
    env_file:
      - .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-dev-only-change-me}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@local}
    ports:
      - "8088:8088"
    volumes:
      - ./superset:/app/pythonpath
      - superset_home:/app/superset_home
    depends_on:
      db:
        condition: service_healthy
    command: ["/bin/bash", "/app/pythonpath/bootstrap.sh"]

volumes:
  eu-merger-arbitration:
    name: eu-merger-arbitration-pg
  superset_home:
    name: eu-merger-arbitration-superset-home
